# Optional. This machine already runs a local `postgresql-x64-17` service, which
# is the documented default. Use this only on a machine without one.
services:
  postgres:
    image: postgres:17-alpine
    container_name: strategy-manager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strategy_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strategy_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
