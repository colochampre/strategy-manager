[project]
name = "strategy-manager"
version = "0.1.0"
description = "Capital-allocation engine for TradingView strategies executing on Pionex"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "cryptography>=44.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database (strategy_manager_test)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SIM300 reads an UPPER_CASE constant as a literal and demands it move to the
# right-hand side. Tests read as `actual == expected`; keep that convention.
"tests/*" = ["SIM300"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
